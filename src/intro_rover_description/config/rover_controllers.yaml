controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_velocity_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    steering_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

wheel_velocity_controller:
  ros__parameters:
    joints:
      - fl_wheel
      - fr_wheel
      - bl_wheel
      - br_wheel
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    interpolate_from_desired_state: true
    gains:
      fl_wheel: {p: 20.0, i: 0.0, d: 0.5}
      fr_wheel: {p: 20.0, i: 0.0, d: 0.5}
      bl_wheel: {p: 20.0, i: 0.0, d: 0.5}
      br_wheel: {p: 20.0, i: 0.0, d: 0.5}

steering_position_controller:
  ros__parameters:
    joints:
      - fl_swerve_yaw
      - fr_swerve_yaw
      - bl_swerve_yaw
      - br_swerve_yaw
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true

arm_controller:
  ros__parameters:
    joints:
      - shoulder_yaw
      - shoulder_pitch
      - elbow_pitch
      - elbow_roll
      - wrist_pitch
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true